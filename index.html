<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amigos invisibles</title>
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="top">
      <div><h1>🎁 Amigos invisibles</h1><div class="small">Gestión independiente de todos los eventos.</div></div>
      <button class="btn primary" onclick="openCreate()">+ Nuevo</button>
    </div>
  </div>

  <div class="card">
    <div class="top">
      <div><b>Amigos invisibles</b><div class="small">Por defecto se muestran únicamente los vinculados a eventos activos.</div></div>
      <button id="filterBtn" class="btn light" onclick="toggleFilters()">Mostrar filtros</button>
    </div>

    <div id="filters" class="hidden" style="margin-top:12px">
      <div class="grid2">
        <div><label>Buscar por nombre</label><input id="search" placeholder="Nombre..." oninput="renderList()"></div>
        <div>
          <label>Mostrar</label>
          <select id="scope" onchange="renderList()">
            <option value="active">Solo activos</option>
            <option value="past">Solo pasados/cerrados</option>
            <option value="all">Todos</option>
          </select>
        </div>
      </div>
    </div>

    <div id="list" style="margin-top:10px"></div>
  </div>
</div>

<dialog id="createDialog">
  <div class="card" style="margin:0">
    <h2>Crear Amigo invisible</h2>
    <div class="field">
      <label>Evento activo</label>
      <select id="meetingSelect" onchange="updateAutoName()"></select>
    </div>
    <div class="field">
      <label>Nombre</label>
      <input id="autoName" disabled>
    </div>
    <div class="field">
      <label>Importe máximo (€)</label>
      <input id="maxAmount" type="number" min="0" step="0.01" value="0">
    </div>
    <div class="grid2" style="margin-top:14px">
      <button class="btn light" onclick="createDialog.close()">Cancelar</button>
      <button class="btn primary" onclick="createExchange()">Crear</button>
    </div>
  </div>
</dialog>

<script>
const cfg=window.APP_CONFIG||{};
const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);
let exchanges=[],availableMeetings=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(v){if(!v)return '';const d=new Date(v+'T12:00:00');return d.toLocaleDateString('es-ES')}
function euro(v){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(v||0))}
async function rpc(name,args={}){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}

async function load(){
  try{
    const d=await rpc('secret_santa_app_home');
    exchanges=d.exchanges||[];
    availableMeetings=d.available_meetings||[];
    renderList();
  }catch(e){alert(e.message||e)}
}

function toggleFilters(){
  const el=document.getElementById('filters');
  const hidden=el.classList.toggle('hidden');
  filterBtn.textContent=hidden?'Mostrar filtros':'Ocultar filtros';
}

function isActiveExchange(x){return x.meeting_status==='Activa'}

function renderList(){
  const q=(search.value||'').trim().toLowerCase();
  const s=scope.value;
  let rows=exchanges.filter(x=>{
    if(q && !(x.name||'').toLowerCase().includes(q))return false;
    const active=isActiveExchange(x);
    if(s==='active'&&!active)return false;
    if(s==='past'&&active)return false;
    return true;
  });

  list.innerHTML=rows.map(x=>`
    <div class="tile" style="margin-bottom:10px">
      <div class="top">
        <div style="min-width:0;flex:1">
          <b style="font-size:18px">${esc(x.name)}</b>
          <div class="small">${x.meeting_name?esc(x.meeting_name)+' · ':''}${fmtDate(x.meeting_date||x.event_date)}</div>
          <div class="small" style="margin-top:8px">Importe máximo: ${euro(x.max_amount)} · ${x.draw_finalized?'Sorteo finalizado':'Pendiente de sorteo'}</div>
        </div>
        <span class="pill">${isActiveExchange(x)?'Activo':'Pasado'}</span>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap">
        <a class="btn light" href="manage.html?id=${encodeURIComponent(x.id)}">Abrir</a>
        <button class="btn danger" onclick="deleteExchange('${x.id}')">Eliminar</button>
      </div>
    </div>
  `).join('')||'<div class="small">No hay Amigos invisibles que coincidan.</div>';
}

function openCreate(){
  if(!availableMeetings.length)return alert('No hay eventos activos disponibles sin Amigo invisible.');
  meetingSelect.innerHTML=availableMeetings.map(m=>`<option value="${m.id}">${esc(m.name)} · ${fmtDate(m.meeting_date)}</option>`).join('');
  maxAmount.value='0';
  updateAutoName();
  createDialog.showModal();
}
function updateAutoName(){
  const m=availableMeetings.find(x=>x.id===meetingSelect.value);
  autoName.value=m?'Amigo invisible - '+m.name:'';
}
async function createExchange(){
  const meetingId=meetingSelect.value;
  if(!meetingId)return alert('Selecciona un evento.');
  try{
    const d=await rpc('secret_santa_app_create',{
      p_meeting_id:meetingId,
      p_max_amount:Number(maxAmount.value||0)
    });
    location.href='manage.html?id='+encodeURIComponent(d.id);
  }catch(e){alert(e.message||e)}
}

async function deleteExchange(id){
  const x=exchanges.find(e=>e.id===id);
  if(!x)return;
  const ok=confirm(
    '¿Eliminar "'+x.name+'"?\n\n'+
    'Se borrarán el sorteo, los números de regalo, las exclusiones y sus participantes dentro del Amigo invisible.\n\n'+
    'La reunión vinculada y sus participantes generales NO se eliminarán.\n\n'+
    'Esta acción no se puede deshacer.'
  );
  if(!ok)return;

  try{
    await rpc('secret_santa_app_delete',{p_exchange_id:id});
    await load();
  }catch(e){
    alert(e.message||e);
  }
}
load();
</script>
</body>
</html>
