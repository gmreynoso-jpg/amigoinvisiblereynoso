<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amigo invisible</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app"><div id="err" class="card hidden"><h2>No se puede abrir</h2><div id="errText" class="small"></div></div><div id="main" class="hidden"><div class="card"><h1 id="title">🎁 Amigo invisible</h1><div id="subtitle" class="small"></div><div id="amount" class="pill"></div></div><div class="card"><h2>Recepción de regalos</h2><div id="stats" class="small"></div><div class="field"><input id="search" placeholder="Buscar participante..." oninput="renderPeople()"></div><div id="people"></div></div><div class="card"><h2>Sorteo</h2><div id="drawInfo" class="small"></div><button id="simulateBtn" class="btn light full" onclick="simulate()">🧪 Simular sorteo</button><div id="simBox" class="sim hidden"><div class="top"><b>Simulación</b><button class="btn light" onclick="simBox.classList.add('hidden')">Cerrar</button></div><div id="simSummary"></div><div id="simResults"></div></div><button id="finalBtn" class="btn primary full" onclick="finalizeDraw()">🎲 Sorteo definitivo</button><button id="resetBtn" class="btn danger full hidden" onclick="resetDraw()">Reiniciar sorteo</button><div id="finalStatus" class="hidden"></div></div><div id="resultsCard" class="card hidden"><h2>Consultar resultado individual</h2><div class="field"><select id="personResult"></select></div><button class="btn primary full" onclick="showResult()">Mostrar número</button><div id="revealed" class="hidden" style="text-align:center"><div id="revealedName"></div><div class="small">Tu regalo es el número</div><div id="revealedNumber" class="result"></div><button class="btn light" onclick="hideResult()">Ocultar</button></div></div></div></div><script src="app.js"></script></body></html>
