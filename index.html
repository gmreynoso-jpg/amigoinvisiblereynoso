<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amigos invisibles</title>
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="top">
      <div><h1>🎁 Amigos invisibles</h1><div class="small">Sorteos vinculados a reuniones o completamente independientes.</div></div>
      <button class="btn primary" onclick="openCreate()">+ Nuevo</button>
    </div>
  </div>

  <div class="card">
    <div class="top">
      <div><b>Amigos invisibles</b><div class="small">Por defecto se muestran los sorteos abiertos.</div></div>
      <button id="filterBtn" class="btn light" onclick="toggleFilters()">Mostrar filtros</button>
    </div>

    <div id="filters" class="hidden" style="margin-top:12px">
      <div class="grid2">
        <div><label>Buscar por nombre</label><input id="search" placeholder="Nombre..." oninput="renderList()"></div>
        <div>
          <label>Mostrar</label>
          <select id="scope" onchange="renderList()">
            <option value="active">Solo abiertos</option>
            <option value="past">Solo cerrados</option>
            <option value="all">Todos</option>
          </select>
        </div>
      </div>
    </div>

    <div id="list" style="margin-top:10px"></div>
  </div>
</div>

<dialog id="createDialog">
  <div class="card" style="margin:0">
    <h2>Crear Amigo invisible</h2>

    <div class="field">
      <label>Modalidad</label>
      <select id="drawMode" onchange="updateCreateForm()">
        <option value="gift_numbers">🎁 Sorteo de regalos el día del evento</option>
        <option value="classic">🕵️ Amigo invisible clásico</option>
        <option value="blind">🔐 Amigo invisible secreto / ciego</option>
      </select>
      <div id="modeHelp" class="small" style="margin-top:6px"></div>
    </div>

    <div class="field">
      <label>Origen de participantes</label>
      <select id="sourceMode" onchange="updateCreateForm()">
        <option id="meetingSourceOption" value="meeting">Usar una reunión existente</option>
        <option value="independent">Crear independiente</option>
      </select>
      <div id="sourceHelp" class="small" style="margin-top:6px"></div>
    </div>

    <div id="meetingArea" class="field">
      <label>Reunión activa</label>
      <select id="meetingSelect" onchange="updateCreateForm()"></select>
    </div>

    <div class="field">
      <label>Nombre</label>
      <input id="exchangeName">
    </div>

    <div id="dateArea" class="field hidden">
      <label>Fecha del encuentro · opcional</label>
      <input id="eventDate" type="date">
    </div>

    <div class="field">
      <label>Importe máximo (€) · opcional</label>
      <input id="maxAmount" type="number" min="0" step="0.01" value="0">
    </div>

    <div class="grid2" style="margin-top:14px">
      <button class="btn light" onclick="createDialog.close()">Cancelar</button>
      <button class="btn primary" onclick="createExchange()">Crear</button>
    </div>
  </div>
</dialog>

<script>
const cfg=window.APP_CONFIG||{};
const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);
let exchanges=[],availableMeetings=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(v){if(!v)return '';const d=new Date(v+'T12:00:00');return d.toLocaleDateString('es-ES')}
function euro(v){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(v||0))}
async function rpc(name,args={}){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
function modeLabel(x){
  const m=x.draw_mode||'gift_numbers';
  if(m==='classic')return '🕵️ Clásico';
  if(m==='blind')return '🔐 Secreto / ciego';
  return '🎁 Sorteo de regalos';
}
function isActiveExchange(x){return !x.delivery_closed_at}
function actionFor(x){
  if(x.delivery_closed_at)return {label:'Consultar finalizado',href:'delivery.html?id='+encodeURIComponent(x.id),cls:'light'};
  if(x.delivery_prepared_at||x.delivery_locked)return {label:x.delivery_paused?'Reanudar entrega':'Continuar entrega',href:'delivery.html?id='+encodeURIComponent(x.id),cls:'primary'};
  if(x.draw_finalized)return {label:'Continuar desde sorteo',href:'manage.html?id='+encodeURIComponent(x.id),cls:'primary'};
  return {label:'Continuar preparación',href:'manage.html?id='+encodeURIComponent(x.id),cls:'light'};
}
function stateLabel(x){
  if(x.delivery_closed_at)return 'Finalizado';
  if(x.delivery_paused)return 'Entrega pausada';
  if(x.delivery_prepared_at||x.delivery_locked)return 'Entrega en curso';
  if(x.draw_finalized)return 'Sorteo realizado';
  return 'Preparación';
}

async function load(){
  try{
    const d=await rpc('secret_santa_app_home');
    exchanges=d.exchanges||[];
    availableMeetings=d.available_meetings||[];
    renderList();
  }catch(e){alert(e.message||e)}
}

function toggleFilters(){
  const el=document.getElementById('filters');
  const hidden=el.classList.toggle('hidden');
  filterBtn.textContent=hidden?'Mostrar filtros':'Ocultar filtros';
}

function renderList(){
  const q=(search.value||'').trim().toLowerCase();
  const s=scope.value;
  let rows=exchanges.filter(x=>{
    if(q && !(x.name||'').toLowerCase().includes(q))return false;
    const active=isActiveExchange(x);
    if(s==='active'&&!active)return false;
    if(s==='past'&&active)return false;
    return true;
  });

  list.innerHTML=rows.map(x=>{
    const action=actionFor(x);
    return `
    <div class="tile" style="margin-bottom:10px">
      <div class="top">
        <div style="min-width:0;flex:1">
          <b style="font-size:18px">${esc(x.name)}</b>
          <div class="small">${x.meeting_name?'📅 '+esc(x.meeting_name):'🎁 Independiente'}${(x.meeting_date||x.event_date)?' · '+fmtDate(x.meeting_date||x.event_date):''}</div>
          <div class="small" style="margin-top:6px">${modeLabel(x)} · Importe máximo: ${euro(x.max_amount)}</div>
        </div>
        <span class="pill">${stateLabel(x)}</span>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap">
        <a class="btn ${action.cls}" href="${action.href}">${action.label}</a>
        ${x.delivery_closed_at?'<span class="pill">Solo consulta</span>':(x.delivery_prepared_at||x.delivery_locked)?'<span class="pill">Entrega protegida</span>':`<button class="btn danger" onclick="deleteExchange('${x.id}')">Eliminar</button>`}
      </div>
    </div>`;
  }).join('')||'<div class="small">No hay Amigos invisibles que coincidan.</div>';
}

function openCreate(){
  drawMode.value='gift_numbers';
  const hasMeetings=availableMeetings.length>0;
  meetingSourceOption.disabled=!hasMeetings;
  sourceMode.value=hasMeetings?'meeting':'independent';
  meetingSelect.innerHTML=availableMeetings.map(m=>`<option value="${m.id}">${esc(m.name)} · ${fmtDate(m.meeting_date)}</option>`).join('');
  exchangeName.value='';
  eventDate.value='';
  maxAmount.value='0';
  updateCreateForm();
  createDialog.showModal();
}

function updateCreateForm(){
  const hasMeetings=availableMeetings.length>0;
  meetingSourceOption.disabled=!hasMeetings;
  if(!hasMeetings&&sourceMode.value==='meeting')sourceMode.value='independent';
  const independent=sourceMode.value==='independent';
  const classic=drawMode.value==='classic';
  const blind=drawMode.value==='blind';
  meetingArea.classList.toggle('hidden',independent||!hasMeetings);
  dateArea.classList.toggle('hidden',!independent);
  sourceHelp.textContent=hasMeetings
    ? (independent?'Crearás un sorteo sin vincularlo a ninguna reunión.':'Se copiarán los participantes y grupos de la reunión seleccionada.')
    : 'No hay reuniones activas disponibles sin Amigo invisible. Puedes crear este sorteo como independiente.';
  modeHelp.textContent=classic
    ?'El sorteo se hace antes: cada persona recibe por correo quién le ha tocado. El email es obligatorio.'
    :blind
      ?'Cada persona recibe por correo únicamente una ficha anónima de gustos y deseos. Nadie, tampoco el organizador, ve quién regala a quién. El email es obligatorio.'
      :'Los regalos se numeran el día del encuentro y nadie sabe previamente quién recibirá cada regalo. El email no es obligatorio.';
  if(!independent){
    const m=availableMeetings.find(x=>x.id===meetingSelect.value);
    exchangeName.value=m?((classic?'Amigo invisible - ':blind?'Amigo invisible secreto - ':'Sorteo de regalos - ')+m.name):'';
  }else if(!exchangeName.value.trim()){
    exchangeName.value=classic?'Amigo invisible':blind?'Amigo invisible secreto':'Sorteo de regalos';
  }
}

async function createExchange(){
  const independent=sourceMode.value==='independent';
  const meetingId=independent?null:meetingSelect.value;
  if(!independent&&!meetingId)return alert('Selecciona una reunión.');
  if(independent&&!exchangeName.value.trim())return alert('Indica un nombre.');
  try{
    const d=await rpc('secret_santa_app_create_v3',{
      p_meeting_id:meetingId,
      p_name:exchangeName.value.trim()||null,
      p_event_date:independent?(eventDate.value||null):null,
      p_max_amount:Number(maxAmount.value||0),
      p_draw_mode:drawMode.value
    });
    location.href='manage.html?id='+encodeURIComponent(d.id);
  }catch(e){alert(e.message||e)}
}

async function deleteExchange(id){
  const x=exchanges.find(e=>e.id===id);
  if(!x)return;
  if(x.delivery_prepared_at||x.delivery_locked||x.delivery_closed_at)return alert('La entrega ya se ha iniciado o el Amigo invisible está finalizado. No se puede eliminar.');
  const linked=!!x.meeting_id;
  const ok=confirm(
    '¿Eliminar "'+x.name+'"?\n\n'+
    'Se borrarán sus participantes internos, exclusiones y cualquier preparación del sorteo.\n\n'+
    (linked?'La reunión vinculada y sus participantes generales NO se eliminarán.\n\n':'')+
    'Esta acción no se puede deshacer.'
  );
  if(!ok)return;
  try{await rpc('secret_santa_app_delete',{p_exchange_id:id});await load()}catch(e){alert(e.message||e)}
}
load();
</script>
</body>
</html>
